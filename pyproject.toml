[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tha-google-runner"
version = "0.4.0"
description = "A Tabular Helper API library that wraps Google Sheets, Docs, Drive, Slides, and Gmail with a typed, consistent interface."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nate Wright" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = ["google", "sheets", "docs", "drive", "slides", "gmail", "tabular", "helper"]
dependencies = [
    "google-auth==2.59.1",
    "google-auth-oauthlib==1.5.0",
    "platformdirs==4.12.2",
    "tha-req-runner==0.3.0",
]

[project.optional-dependencies]
httpx2 = ["tha-req-runner[httpx2]==0.3.0"]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "deptry>=0.25.1",
    "pip-audit>=2.10.1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
tha-google-init = "tha_google_runner.cli:init"

[project.urls]
Homepage = "https://github.com/tha-guy-nate/tha-google-runner"
Issues = "https://github.com/tha-guy-nate/tha-google-runner/issues"
Changelog = "https://github.com/tha-guy-nate/tha-google-runner/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tha_google_runner"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.deptry]
known_first_party = ["tha_google_runner"]
optional_dependencies_dev_groups = ["dev"]

[tool.coverage.run]
source = ["src"]
